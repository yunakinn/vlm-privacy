<g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><text x="38" y="44" fill="#526681" font-size="14" font-weight="700" text-anchor="start">VLM PRIVACY EVALUATION</text><text x="38" y="82" fill="#172942" font-size="28" font-weight="700" text-anchor="start">From image evidence to calibrated evaluation</text><rect x="38" y="120" width="229" height="113" rx="14" fill="#ffffff" stroke="#dce4ef"/><text x="54" y="147" fill="#526681" font-size="12" font-weight="700" text-anchor="start">01 / INPUT</text><text x="54" y="179" fill="#24334b" font-size="17" font-weight="700" text-anchor="start">Image + question</text><text x="54" y="207" fill="#60738d" font-size="14" font-weight="400" text-anchor="start">Age · Gender · Race</text><path d="M268,176 L297,176" fill="none" stroke="#8898ad" stroke-width="2" marker-end="url(#arrow)"/><rect x="303" y="120" width="229" height="113" rx="14" fill="#ffffff" stroke="#dce4ef"/><text x="319" y="147" fill="#526681" font-size="12" font-weight="700" text-anchor="start">02 / BALANCE</text><text x="319" y="179" fill="#24334b" font-size="17" font-weight="700" text-anchor="start">Rotate answer choices</text><text x="319" y="207" fill="#60738d" font-size="14" font-weight="400" text-anchor="start">Cyclic permutations</text><path d="M533,176 L562,176" fill="none" stroke="#8898ad" stroke-width="2" marker-end="url(#arrow)"/><rect x="568" y="120" width="229" height="113" rx="14" fill="#ffffff" stroke="#dce4ef"/><text x="584" y="147" fill="#526681" font-size="12" font-weight="700" text-anchor="start">03 / SCORE</text><text x="584" y="179" fill="#24334b" font-size="17" font-weight="700" text-anchor="start">LLaVA-1.5-7B</text><text x="584" y="207" fill="#60738d" font-size="14" font-weight="400" text-anchor="start">4 decoding methods</text><path d="M798,176 L827,176" fill="none" stroke="#8898ad" stroke-width="2" marker-end="url(#arrow)"/><rect x="833" y="120" width="229" height="113" rx="14" fill="#ffffff" stroke="#dce4ef"/><text x="849" y="147" fill="#526681" font-size="12" font-weight="700" text-anchor="start">04 / AGGREGATE</text><text x="849" y="179" fill="#24334b" font-size="17" font-weight="700" text-anchor="start">Average probabilities</text><text x="849" y="207" fill="#60738d" font-size="14" font-weight="400" text-anchor="start">Prediction + confidence</text><path d="M948,234 L948,268" fill="none" stroke="#8898ad" stroke-width="2" marker-end="url(#arrow)"/><rect x="303" y="280" width="759" height="82" rx="14" fill="#eaf0fc" stroke="#dce4ef"/><text x="325" y="310" fill="#526681" font-size="12" font-weight="700" text-anchor="start">COMPARE AGAINST BASELINE</text><text x="325" y="340" fill="#24334b" font-size="20" font-weight="600" text-anchor="start">Accuracy · Mean confidence · ECE · Brier score</text><text x="38" y="292" fill="#526681" font-size="12" font-weight="700" text-anchor="start">DECODING METHODS</text><text x="38" y="321" fill="#24334b" font-size="19" font-weight="600" text-anchor="start">Baseline · VCD</text><text x="38" y="348" fill="#24334b" font-size="19" font-weight="600" text-anchor="start">M3ID · ICD</text><text x="38" y="406" fill="#60738d" font-size="15" font-weight="400" text-anchor="start">Choice-based evaluation · free-form generations are auxiliary outputs</text></g></svg>